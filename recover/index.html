<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在跳转…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #fbf7f4;
        color: #4a5160;
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
    </style>
    <script>
      // 这台静态托管对带 ? 的地址一律 404，所以参数只能走 hash：
      //   /recover?userId=..&secret=..  ->  /#reset?userId=..&secret=..
      (function () {
        var q = location.search.replace(/^\?/, '');
        var extra = location.hash.replace(/^#/, '').replace(/^reset\??/, '');
        var all = [q, extra].filter(Boolean).join('&');
        location.replace('/#reset' + (all ? '?' + all : ''));
      })();
    </script>
  </head>
  <body>
    <p>正在跳转…</p>
  </body>
</html>
