<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在验证…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #fbf7f4;
        color: #4a5160;
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
    </style>
    <script>
      // 这台静态托管会把任何带 ? 的地址当成不存在的文件名（直接 404），
      // 所以参数必须塞进 hash，服务器看不到，也就不会 404。
      //   /verify?userId=..&secret=..  ->  /#verify?userId=..&secret=..
      (function () {
        var q = location.search.replace(/^\?/, '');
        var extra = location.hash.replace(/^#/, '').replace(/^verify\??/, '');
        var all = [q, extra].filter(Boolean).join('&');
        location.replace('/#verify' + (all ? '?' + all : ''));
      })();
    </script>
  </head>
  <body>
    <p>正在跳转…</p>
  </body>
</html>
